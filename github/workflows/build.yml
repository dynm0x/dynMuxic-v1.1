
name: Build dynMuxic v1.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract dynMuxic v1.1 source
        run: |
          unzip -o dynMuxic-Update-Source-v1.1.zip -d source

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: source/PixelPlayerOffline
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dynMuxic-v1.1-debug-apk
          path: source/PixelPlayerOffline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
