
name: Build dynMuxic v2.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dynMuxic-v2.0-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source project
        run: unzip -o dynMuxic-v2.0-source.zip -d .

      - name: Build APK
        working-directory: dynMuxic-v2.0
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dynMuxic-v2.0-debug
          path: dynMuxic-v2.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
